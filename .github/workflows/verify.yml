name: verify

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: APK checksums match dist/SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: No APK outside dist/
        run: |
          found=$(git ls-files '*.apk' | grep -v '^dist/' || true)
          if [ -n "$found" ]; then echo "APK outside dist/: $found"; exit 1; fi

      - name: No keystores or binaries outside dist/
        run: |
          found=$(git ls-files | grep -E '\.(jks|keystore|p12|pem|key)$' || true)
          if [ -n "$found" ]; then echo "secret material tracked: $found"; exit 1; fi

      - name: README relative links resolve
        run: |
          python3 - <<'PY'
          import re, os, sys
          bad = []
          for root, _, files in os.walk('.'):
              if '.git' in root:
                  continue
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  p = os.path.join(root, f)
                  for link in re.findall(r'\]\(([^)]+)\)', open(p, encoding='utf-8').read()):
                      if link.startswith(('http', '#', 'mailto')):
                          continue
                      target = os.path.normpath(os.path.join(root, link.split('#')[0]))
                      if not os.path.exists(target):
                          bad.append(f'{p}: {link}')
          print('\n'.join(bad) if bad else 'all relative links resolve')
          sys.exit(1 if bad else 0)
          PY
